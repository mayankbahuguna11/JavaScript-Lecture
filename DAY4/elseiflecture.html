<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>

    <script>

      let marks = 75;

      if (marks >= 90) {
        console.log("Grade A");
      } 
      else if (marks >= 75) {
        console.log("Grade B");
      } 
      else if (marks >= 55) {
        console.log("Grade C");
      }
      else if (marks >= 35) {
        console.log("Grade D")
      }
      else {
        console.log("Fail");    
      }

      
    let a = prompt("Enter number")
      if (a >= 0) {
        document.write(a + " is a Positive number");
        
      }
      else {
        document.write(a + " is a Negative number");
        
      }

    </script>

  </body>
</html>
