<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        let day = 3;
        // switch: Used to compare one expression with multiple expressions
        switch(day) {
            case 1:
                document.write("Monday");
                break;

            case 2:
                document.write("Tuesday");
                break;

            case 3:
                document.write("Wednesday");
                break;

            case 4:
                document.write("Thursday");
                break;

            case 5:
                document.write("Friday");
                break;

            case 6:
                document.write("Saturday");
                break;
                
             case 7:
                document.write("Sunday");
                break;      

            default:
                document.write("Invalid Day");
                break;
        }

        //task
        let name = "Rohan";
        switch(name) {
            case "Vivek":
                document.write("<br>Hello Vivek");
                break;

            case "Rohan":
                document.write("<br>Hello Rohan");
                break;

            case "Krishna":
                document.write("<br>Hello Krishna");
                break;

            default:
                document.write("<br>Invalid Name");
                break;
        }

    </script>

</body>
</html>
