<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p class="demo">Hello</p>
    <p class="demo">Welcome</p>
    <p class="demo">Javascript</p>
    <button onclick="changecolor()">submit</button>

    <script>

        function changecolor(){
            let data = document.querySelector(".demo");
            // querySelector: used to select the first HTML element that matches a specified CSS selector.
            data.style.color="red";
        };

    </script>

</body>
</html>
