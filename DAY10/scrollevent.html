<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body onscroll="showmessage()">

    <h2>JavaScript Scroll Event</h2>
    <div style="height: 1500px;">
        <h3>Keep Scrolling down</h3>
    </div>

    <script>
        function showmessage(){
            alert("I am scrolling the page");
        }
    </script>

</body>
</html>
