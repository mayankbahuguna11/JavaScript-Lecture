<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" onkeydown="KeyDown()" placeholder="enter name">

    <input type="text" onkeyup="KeyUp()" placeholder="enter email">

    <script>

        function KeyDown(){
           console.log("This is a message");
        };

        function KeyUp(){
            alert("This is a message")
        };

    </script>

</body>
</html>
