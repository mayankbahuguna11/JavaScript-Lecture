<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="alertmessage()">onclick</button>

    <br><br>

    <button ondblclick="alertmessage()">double click</button>

    <br><br>

    <button onmouseleave="alertmessage()">mouse leave</button>

    <br><br>

    <button onmouseup="alertmessage()">mouse up</button>

    <br><br>

    <button onmousedown="alertmessage()">mouse down</button>

    <br><br>

    <button onmouseover="alertmessage()">mouse over</button>

    <script>
        function alertmessage(){
            alert("This is a message");
            // console.log("Hello");
        }
    </script>
</body>
</html>
