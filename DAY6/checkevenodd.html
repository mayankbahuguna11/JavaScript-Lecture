<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        function checkevenodd(a){
            if (a % 2 == 0){
                document.write(a + " is an Even Number")
            }
            else{
                document.write(a + " is an Odd number")
            }
        }
        checkevenodd(5);

    </script>

</body>
</html>
