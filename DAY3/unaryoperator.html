<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        let a = 8;
        a++;
        //++ in suffix prints value first then adds
        console.log(a);
        
        let c = 8;
        console.log(++c);
        //++ in prefix adds value first then prints
        

        let b = 5;
        b--;
        console.log(b);

        //ternary operator
        //condition?value1:value2
        let age = 67;
        console.log(age>=18?"He can vote":"He cannot vote")

    </script>

</body>
</html>
