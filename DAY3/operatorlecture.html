<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // Operator: Symbol used to perform operations on one or more operands (values or variables).
        // Operand: The value or variable on which an operator performs an operation.

        // Arithmetic Operator
        let a = 2;
        let b = 4;
        let c = a ** b;
        
        console.log(c);
        
        // Assignment Operator
        d = 3;
        d += 5;
        console.log(d);
        
        // Comparison/Relational operator
        let z = 5;
        let y = 3;

        console.log(z == y);
        console.log(z > y);
        console.log(2 >= 4);
        console.log(4 <= 4);

        // True
        console.log(3 == "3")

        // False
        console.log(3 === "3")
        // Strict equal: checks value and data type both.
        
        // True
        console.log(3 !== "3");
        // Strict not equal: Both value and data type should be different.
        
        // Logical Operator
        let m = 12;
        let n = 6;

        // Logical AND: Returns true if ALL statements are true.
        console.log(m > n && m >= 10);
        
        // Logical OR: Returns true if ATLEAST ONE statement is true.
        console.log(m > n || n > 10)

        // NOT: Reverses the boolean value.
        console.log(!(m > n));
        // True becomes false and vice-versa.

    </script>

</body>
</html>
