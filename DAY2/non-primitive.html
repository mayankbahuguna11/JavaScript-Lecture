<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        // Non-primitive: Data type that can store multiple values or complex data.

        // Object: Stores data as key-value pairs.
        let college = {
            name : "Rohan",
            age : 24,
            city : "Mumbai"
        }
        
        console.log(college);
        
        console.log(college.name);
        console.log(college.city);
        
        // Array: It is mutable.
        let name = ["Rohan", "Ajay", "Shivam", 3453, true];
        // Dynamically typed: Can store multuple data types in a variable

        console.log(name);
        console.log(name[3]);
        
        

    </script>

</body>
</html>
