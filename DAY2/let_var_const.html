<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        var z = 30;
        // var: Variable can be re-declared and reassigned. A global scope variable (declared outside any function() or block{} so it can be accessed from anywhere in the program).
        var z = 20; 
        // redeclared

        z = 29;
        // reassigned

        let y = 20;
        // let: Variable cannot be re-declared but can be reassigned. A block variable (declared inside a block and can only be accessed within it).
        y = 45;
        // reassigned

        const x = 67;
        // const: Variable cannot be re-declared or reassigned. A block variable (declared inside a block and can only be accessed within it). 

        console.log(z);
        console.log(y);
        console.log(x);

    </script>

</body>
</html>
