<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        console.log("This is console");

        document.write("<h1>JavaScript Website</h1>")

        alert("Welcome to Js");
        // Alert: Used to display a message in a popup dialog box.

        name = prompt("Enter your name");
        address = prompt("Enter your address");
        // Prompt: Used to take user input in a popup dialog box.
        document.write("My name is " + name + " and address is " + address);

        confirm("Are you sure?");
        // Confirm: Used to ask user for confirmation in a popup dialog box.
        
    </script>
</body>
</html>
