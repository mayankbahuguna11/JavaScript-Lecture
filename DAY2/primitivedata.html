<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        // Primitive: Basic data type that stores a single value.

        //number
        let age = 34;
        console.log(age, typeof age);

        let n = 3453.3;
        console.log(n, typeof n);

        //bigint
        let y = 34242526246n;
        console.log(y, typeof y);
        
        //name
        let name = "Rahul";
        console.log(name, typeof name);
        
        let firstname = "8282";
        console.log(firstname, typeof firstname);
        
        //boolean
        na = true;
        console.log(na, typeof na);

        nam = false;
        console.log(nam, typeof nam);

        //undefined
        let value;
        console.log(value, typeof value);

        //object
        let address1 = null;
        console.log(address1, typeof address1);

        //symbol
        cityname = Symbol("id");
        console.log(cityname, typeof cityname);

    </script>

</body>
</html>
