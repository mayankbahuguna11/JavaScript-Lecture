<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        //for loop: Used when you know how many times the loop should execute.

        for (let i = 1; i <= 10; i++){
            document.write("Hello <br>");
        }

        document.write("<br>");

        for (let i = 1; i <= 10; i++){
            document.write(i, "<br>");
        }

        document.write("<br>");

        for (let q = 20; q <=30; q++){
            document.write(q, "<br>");
        }

        document.write("<br>");

        for (let j = 10; j >=0; j--){
            document.write(j, "<br>");
        }

        document.write("<br>");

        for (let k = 100; k >= 90; k--){
            document.write(k, "<br>");
        }

        document.write("<br>");

        for (let h =1; h <= 20; h = h + 2){
            document.write(h, "<br>");
        }

    </script>

</body>
</html>
