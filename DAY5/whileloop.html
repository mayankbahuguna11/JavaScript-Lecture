<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        //while loop: Executes the code as long as the condition is true.
        let i = 1;
        while (i <= 5){
            document.write("Hello World <br>");
            i++;
        }

        document.write("<br>");

        let j = 90;
        while (j >= 80){
            document.write(j, "<br>");
            j--;
        }

        document.write("<br>");

        //do while loop: Executes the code at least once even if the condition is false.
        let z = 1;
        do {
            document.write(z + "<br>");
            z++;
        }
        while(z <= 5);

    </script>

</body>
</html>
